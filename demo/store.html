<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonkeySkill Store</title>
    <link rel="stylesheet" href="/store.css">
  </head>
  <body>
    <header class="hero">
      <nav><span class="brand"><b>M</b> MonkeySkill Store</span><span id="connection" class="connection">連線中…</span></nav>
      <div class="hero-copy">
        <span class="eyebrow">INSTALL ABILITIES, NOT EXTENSIONS</span>
        <h1>需要的功能，<br>現在才生成。</h1>
        <p>選擇 MSkill，由你的 LLM 生成程式碼，通過固定測試後再由你核准安裝。</p>
      </div>
    </header>

    <main>
      <div class="catalog-heading">
        <div><span class="eyebrow">LOCAL CATALOG</span><h2>可用的 MSkills</h2></div>
        <span id="count" class="count"></span>
      </div>
      <div id="notice" class="notice" hidden></div>
      <section id="catalog" class="catalog" aria-live="polite"></section>
    </main>

    <dialog id="decision-dialog">
      <form method="dialog">
        <span id="dialog-eyebrow" class="eyebrow"></span>
        <h2 id="dialog-title"></h2>
        <p id="dialog-copy"></p>
        <div id="dialog-details" class="dialog-details" hidden></div>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">取消</button>
          <button id="dialog-confirm" value="confirm" class="primary">是</button>
        </div>
      </form>
    </dialog>

    <template id="skill-template">
      <article class="skill-card">
        <div class="skill-top"><span class="skill-icon">M</span><span class="badge"></span></div>
        <div><span class="version"></span><h3></h3><p class="description"></p></div>
        <div class="modes"></div>
        <div class="card-footer"><span class="skill-status"></span><button class="install primary">安裝</button></div>
      </article>
    </template>

    <script type="module" src="/store.js"></script>
  </body>
</html>
