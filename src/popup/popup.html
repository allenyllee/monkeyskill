<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonkeySkill</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark" aria-hidden="true">M</div>
        <div><h1>MonkeySkill</h1><p>Teach your browser a new trick.</p></div>
      </header>

      <section class="skill-card">
        <div class="skill-heading">
          <div><span class="eyebrow">INSTALLED MSKILL</span><h2 id="skill-name">尚未安裝 MSkill</h2></div>
          <span id="source" class="local-badge">Store</span>
        </div>

        <label for="skill-picker">MSkill</label>
        <select id="skill-picker"></select>

        <label for="site-mode">目前網站</label>
        <div id="site-name" class="site-name">讀取中…</div>
        <select id="site-mode"></select>

        <label for="global-mode">全域模式</label>
        <select id="global-mode"></select>

        <div class="actions">
          <button id="save" class="primary">套用設定</button>
          <button id="manage" class="secondary">管理</button>
        </div>
        <button id="store" class="secondary" type="button">開啟 MSkill Store</button>
        <p id="status" class="status" role="status"></p>
      </section>
      <footer>功能必須先從 Store 生成、驗證並核准安裝。</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
